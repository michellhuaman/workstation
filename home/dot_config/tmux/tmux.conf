set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g focus-events on

# True color, since Alacritty sets TERM=xterm-256color.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Catppuccin Mocha, like Alacritty. chezmoi clones the plugin (see
# .chezmoiexternal.toml.tmpl); its options must be set before it loads.
set -g status-position top
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"   # square tabs
set -g @catppuccin_status_left_separator "█"   # square edge on the top-right modules
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"
set -g status-style bg=default
