# What chezmoi installs in your home folder, without sudo.
#
# System packages (apt, mise included) are in lists/ at the repo root
# instead (setup.sh).
# Editing any list here makes the matching run_onchange_ script rerun
# on the next `chezmoi apply`.

packages:
  # Installed per user from Flathub (no root, no polkit prompt). Brave and VS
  # Code are apt packages instead (lists/apt.txt). This is the
  # whole set: per-user apps not listed here are uninstalled (their data in
  # ~/.var/app stays).
  flatpak:
    - com.bitwarden.desktop                   # passwords, and the SSH agent (for git push)
    - io.github.celluloid_player.Celluloid
    - org.libreoffice.LibreOffice
    - org.localsend.localsend_app
    - net.ankiweb.Anki
    - org.gnome.Extensions                    # GNOME Shell extensions: turn on/off and configure the installed ones
    - io.gitlab.ilshat_apps.manuscript        # Markdown Reader
    - com.bilingify.readest                   # EPUB reader

fonts:
  # Bump a version to make the font script download it again, together with
  # its checksum: the release's SHA-256.txt line for JetBrainsMono.tar.xz
  # (update-pins.sh fills both in). The download is checked against it.
  nerd_fonts: v3.5.1              # JetBrainsMono Nerd Font
  nerd_fonts_sha256: 04d5e8f903693f9dd13e16f867e994834e681eb3c72c0d337a770dcda09010cf

services:
  # User units from dot_config/systemd/user, enabled and started after files
  # are applied.
  user:
    - flatpak-user-manager.timer  # daily flatpak update, on AC power only
    - random-wallpaper.timer      # daily random wallpaper from ~/Pictures/wallpapers
    - rclone-drive.service        # mounts Google Drive at ~/.gdrive; skipped until rclone is signed in
