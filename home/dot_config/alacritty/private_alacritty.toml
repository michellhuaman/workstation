# ~/.config/alacritty/alacritty.toml

[general]
import = ["~/.config/alacritty/themes/catppuccin-mocha.toml"]

[env]
TERM = "xterm-256color"

[window]
padding = { x = 6, y = 6 }
opacity = 1
dynamic_padding = true
decorations = "Full"
startup_mode = "Windowed"

[font]
# Check the exact name with: fc-list : family | grep -i <font>
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
size = 13
offset = { x = 0, y = 1 }

[cursor.style]
shape = "Beam"
blinking = "Off"

# Shift+Enter: new line without submitting (Claude Code, chat TUIs)
[[keyboard.bindings]]
key = "Enter"
mods = "Shift"
chars = "\u001B\r"

# F11: toggle fullscreen
[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"
